name: InstaBox Keepalive

# 看门狗主 workflow —— 三层调度设计：
#
#   1. 链式自我触发（主通道）：每轮 run 结束前用 GITHUB_TOKEN dispatch 自己，
#      间隔稳定约 4 分钟。GitHub 官方文档明确 workflow_dispatch 事件可以被
#      GITHUB_TOKEN 触发（是「不触发新 run」规则的唯二例外之一）。
#      为什么不用纯 schedule：实测本仓库 */9 的 cron 被 GitHub 调度饥饿压制到
#      每 4~5 小时才执行一次，租约早过期了。
#   2. schedule 兜底（*/30）：链式断掉（API 限流/失败）时重新点火。
#      即使调度饥饿延迟数小时，也能保证链最终重燃。
#   3. 手动 dispatch：mode = keepalive / status / release / restart。
#
# 每轮对机器做：
#   - 续租 activity lease（TTL 3600s，压住空闲 30 分钟挂起）
#   - 距 8 小时运行上限 ≤ 30 分钟 → 主动 suspend → resume 清零计时（不吃 10 分钟冷却）
#   - 机器已被平台挂起 → 自动唤醒；冷却中 → 按 cooldownUntil 等待后唤醒
#   - 3x-ui 代理健康检查 → 不可达时自动恢复（API 唤醒 + SSH 容器/端口级自愈）
#     + GitHub Issue 告警

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'keepalive'
        type: choice
        options:
          - keepalive
          - status
          - release
          - restart

permissions:
  contents: read
  actions: write   # 链式 dispatch 自己
  issues: write    # 代理告警 Issue

# 排队不取消：上一轮可能正处于 suspend → resume 轮转中，中断会留下挂起的机器；
# 排队也让链式触发天然串行，不会叠加
concurrency:
  group: instabox-keepalive
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 看门狗核心：续租 + 8h 轮转 + 冷却自愈（scripts/keepalive.sh）----
      - name: Keepalive (lease / 8h cycle / cooldown recovery)
        id: ka
        continue-on-error: true   # 失败也继续跑代理检查与续链（本步骤显红）
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_MACHINE: ${{ vars.INSTABOX_MACHINE }}
          INSTABOX_LEASE: ${{ vars.INSTABOX_LEASE }}
          INSTABOX_LEASE_TTL: ${{ vars.INSTABOX_LEASE_TTL }}
          INSTABOX_CYCLE: ${{ vars.INSTABOX_CYCLE }}
          INSTABOX_CYCLE_MARGIN: ${{ vars.INSTABOX_CYCLE_MARGIN }}
          INSTABOX_CYCLE_HOLD_MIN: ${{ vars.INSTABOX_CYCLE_HOLD_MIN }}
          INSTABOX_CYCLE_HOLD_MAX: ${{ vars.INSTABOX_CYCLE_HOLD_MAX }}
          INSTABOX_COOLDOWN_WAIT_MAX: ${{ vars.INSTABOX_COOLDOWN_WAIT_MAX }}
          INSTABOX_API_URL: ${{ vars.INSTABOX_API_URL }}
        run: |
          MODE='${{ inputs.mode }}'
          case "$MODE" in
            status)  exec sh scripts/keepalive.sh --status ;;
            release) exec sh scripts/keepalive.sh --release ;;
            *)       exec sh scripts/keepalive.sh ;;
          esac

      # ---- 3x-ui 代理健康检查 + 自动恢复 + Issue 告警（scripts/proxy_check.sh）----
      - name: Proxy health check + auto recovery
        id: proxy
        if: always()
        continue-on-error: true
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_API_URL: https://api.instabox.sh
          INSTABOX_SSH_KEY: ${{ secrets.INSTABOX_SSH_KEY }}
          INSTABOX_SSH_HOST: api.instabox.sh
          INSTABOX_SSH_PORT: '2222'
          INSTABOX_SSH_USER: ${{ vars.INSTABOX_SSH_USER }}
          PROXY_HOST: ${{ vars.PROXY_HOST }}
          PROXY_PATH: ${{ vars.PROXY_PATH }}
          PANEL_HOST: ${{ vars.PANEL_HOST }}
          PANEL_PATH: ${{ vars.PANEL_PATH }}
          FORCE_RESTART: ${{ inputs.mode == 'restart' && '1' || '0' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 旧版硬编码的地址作为默认值（仓库未配置 vars 时兜底）
          export PROXY_HOST="${PROXY_HOST:-8443-agqvx7j2hautskdu3rml3giune.instabox.tech}"
          export PROXY_PATH="${PROXY_PATH:-/v1s2n8x4q7}"
          export PANEL_HOST="${PANEL_HOST:-2053-agqvx7j2hautskdu3rml3giune.instabox.tech}"
          export PANEL_PATH="${PANEL_PATH:-/618fead1/}"
          export INSTABOX_SSH_USER="${INSTABOX_SSH_USER:-ibssh_3gzc4jpx7fuix6bduacjvqgylq}"
          sh scripts/proxy_check.sh

      # ---- 链式触发下一轮（主调度通道）----
      # sleep 150s 控制节奏：每轮约 4 分钟，一天约 360 轮（public 仓库免费不限分钟）
      - name: Chain next run
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'keepalive' || inputs.mode == '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          sleep 150
          gh workflow run keepalive.yml -R "$REPO" -f mode=keepalive \
            && echo "链式触发成功：下一轮已排队" \
            || echo "链式触发失败（下个 schedule 兜底会重燃）"

      # ---- 汇总判定：核心步骤失败 → run 显红（触发失败邮件通知）----
      - name: Report result
        if: always()
        run: |
          if [ "${{ steps.ka.outcome }}" = "failure" ]; then
            echo "❌ keepalive 核心步骤失败（续租/轮转），详见上方日志"
            exit 1
          fi
          if [ "${{ steps.proxy.outcome }}" = "failure" ]; then
            echo "❌ 代理不可达且自动恢复失败，详见上方日志与告警 Issue"
            exit 1
          fi
          echo "✅ 本轮完成：续租/轮转正常，代理可达"
